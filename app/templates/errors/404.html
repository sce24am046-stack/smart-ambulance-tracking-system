<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found — {{ APP_NAME }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #070b14; text-align: center; padding: 20px; }
    .err-card { max-width: 480px; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 36px; }
  </style>
</head>
<body>
  <div class="err-card">
    <div style="font-size: 48px; font-weight: 800; color: var(--accent-blue);">404</div>
    <h2 style="font-size: 18px; color: #fff; margin: 12px 0;">Record or Route Not Found</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 24px;">
      The requested emergency record, vehicle ID, or operations page does not exist.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Operations</a>
  </div>
</body>
</html>
