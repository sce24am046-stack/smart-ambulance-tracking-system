<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ error_title }} — {{ APP_NAME }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body {
      background: #070b14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .error-card {
      max-width: 500px;
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid var(--accent-red);
      color: var(--accent-red);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <h2 style="font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 8px;">{{ error_title }}</h2>
    <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 24px;">
      {{ error_message }}
    </p>

    <div style="display: flex; gap: 10px; justify-content: center;">
      <a href="{{ url_for('landing') }}" class="btn btn-secondary btn-sm">Home</a>
      <a href="{{ url_for('emergencies.public_register') }}" class="btn btn-danger btn-sm">New Emergency Call</a>
    </div>
  </div>
</body>
</html>
